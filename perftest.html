<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>场景性能测试台 · first-person-mover</title>
<style>
  :root { --bg:#0b1017; --panel:#131b26; --line:#22303f; --txt:#dce6f2; --dim:#8fa0b6; --hi:#4ea1ff; --warn:#ffb454; --ok:#5ecb8a; }
  * { box-sizing: border-box; }
  /* 手机实测清单：不发 touch-action:none 的话，拖动/双击会被页面滚动与双击缩放抢走手势，
     表现成"控件点不动 / 一拖就滚" —— 而这页本来要用来量帧率，被抢手势数据就废了。
     overscroll-behavior 顺带禁掉下拉刷新（手机上误触发会直接打断整轮测试）。 */
  html, body { touch-action:none; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--txt); font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
  /* 刘海屏：HUD 别陷进状态栏/圆角里 */
  #hud { position:fixed; left:12px; top:12px; z-index:10; width:min(560px,94vw);
         /* ⚠ 手机上面板内容比屏幕还高。不限高 + 不许滚 → 底部按钮直接不可达；
            而 html/body 是 touch-action:none，所以面板必须自己声明 pan-y 才滚得动。
            overscroll-behavior:contain 防止滚到底后把滚动传给页面。 */
         max-height:calc(100dvh - 24px); overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain;
         background:color-mix(in srgb,var(--panel) 92%,transparent); border:1px solid var(--line);
         border-radius:10px; padding:12px 14px; backdrop-filter:blur(6px); }
  #hud.collapsed { display:none; }
  .hd { display:flex; align-items:center; gap:8px; margin:0 0 8px; }
  .hd h1 { margin:0; font-size:15px; flex:1; min-width:0; }
  .hd button { padding:4px 10px; font-size:12px; flex:none; }
  /* 收起后的细条：只有一行，保证场景能看见，同时还能读到实时读数 */
  #hudMini { position:fixed; left:12px; top:12px; z-index:11; display:none;
             align-items:center; gap:8px; padding:6px 10px; border-radius:8px;
             background:color-mix(in srgb,var(--panel) 88%,transparent); border:1px solid var(--line);
             backdrop-filter:blur(6px); font-size:12px; max-width:calc(100vw - 24px); }
  #hudMini.show { display:flex; }
  #miniProg { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #miniFps { color:var(--hi); font-weight:600; font-variant-numeric:tabular-nums; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  button { background:#1d2a3a; color:var(--txt); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover:not(:disabled) { background:#26405c; border-color:var(--hi); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { background:#1b4d80; border-color:#2f6ea8; }
  label { color:var(--dim); }
  select, input[type=checkbox] { background:#0e1620; color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:4px 6px; }
  #stats { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:10px 0 6px; }
  .stat { background:#0e1620; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .stat b { display:block; font-size:17px; color:var(--hi); }
  .stat span { color:var(--dim); font-size:11px; }
  #chart { width:100%; height:120px; border:1px solid var(--line); border-radius:6px; display:block; background:#0e1420; }
  #prog { color:var(--warn); font-size:12px; margin:6px 0; min-height:18px; }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  th, td { border:1px solid var(--line); padding:4px 6px; text-align:right; }
  th { background:#16202c; color:var(--dim); font-weight:600; }
  td:first-child, th:first-child { text-align:left; }
  .warn { color:var(--warn); }
  #log { margin-top:8px; max-height:110px; overflow:auto; background:#0e1620; border:1px solid var(--line);
         border-radius:6px; padding:6px 8px; font:11px/1.5 ui-monospace,Consolas,monospace; color:var(--dim); white-space:pre-wrap; }
  .note { color:var(--dim); font-size:11px; margin-top:6px; }
  table.scroll { display:block; overflow-x:auto; }
  /* 渲染画布固定在视口底层，HUD 浮在上面；画布自身也吃掉触摸（否则手机上一拖就滚 HUD） */
  #stage { position:fixed; inset:0; z-index:0; }
  #stage canvas { display:block; width:100%; height:100%; touch-action:none; }
  @media (max-width:640px) {
    /* 手机：面板让出刘海/圆角与底部手势条；统计格 6→3 列（原来 6 列每格只有 ~50px，数字会挤成两行） */
    #hud { left:max(8px, env(safe-area-inset-left)); top:max(8px, env(safe-area-inset-top));
           right:max(8px, env(safe-area-inset-right)); width:auto;
           max-height:calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
           padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
    #hudMini { left:max(8px, env(safe-area-inset-left)); top:max(8px, env(safe-area-inset-top)); }
    #stats { grid-template-columns:repeat(3,1fr); }
    .stat b { font-size:15px; }
    #chart { height:76px; }
    .hd h1 .sub { display:none; }   /* 副标题在手机上不占行 */
    table { font-size:11px; }
    th, td { padding:3px 4px; }
  }
</style>
</head>
<body>
<div id="hud">
  <div class="hd">
    <h1>场景性能测试台 <span class="sub" style="color:var(--dim);font-weight:400">· 真实线上场景 · 一键跑完全部对照实验</span></h1>
    <button id="btnHudHide" title="收起面板，让出画面">收起</button>
  </div>

  <div class="row">
    <button id="btnStart" class="primary">开始测试</button>
    <button id="btnStop" disabled>停止</button>
    <label>时长/场景
      <select id="selDuration">
        <option value="5">5 秒</option>
        <option value="8" selected>8 秒</option>
        <option value="15">15 秒</option>
      </select>
    </label>
    <label>分辨率
      <select id="selScale">
        <option value="0.4">0.4×</option>
        <option value="0.6">0.6×</option>
        <option value="1" selected>1.0×</option>
      </select>
    </label>
    <label>时刻
      <select id="selTime">
        <option value="0.5" selected>正午 12:00</option>
        <option value="0.79">黄昏 19:00</option>
        <option value="0">午夜 00:00</option>
      </select>
    </label>
    <label><input type="checkbox" id="chkColliders" checked /> 构建碰撞体</label>
  </div>
  <div class="note">数据来源：<span id="src">加载中…</span>（远端 /api/scene 优先，失败回退本地打包数据）。碰撞体开关仅在页面加载时生效。</div>

  <div id="stats">
    <div class="stat"><b id="statFps">–</b><span>FPS</span></div>
    <div class="stat"><b id="statMs">–</b><span>帧耗时 ms</span></div>
    <div class="stat"><b id="statCalls">–</b><span>draw call</span></div>
    <div class="stat"><b id="statTris">–</b><span>三角面</span></div>
    <div class="stat"><b id="statProgs">–</b><span>着色器 program</span></div>
    <div class="stat"><b id="statHeap">–</b><span>堆内存 MB</span></div>
  </div>

  <canvas id="chart" width="600" height="120"></canvas>
  <div id="prog">准备中…</div>

  <div class="row">
    <button id="btnJson">导出 JSON</button>
    <button id="btnCsv">导出 CSV（摘要+逐帧）</button>
    <button id="btnCopy">复制摘要</button>
  </div>

  <table class="scroll">
    <thead>
      <tr>
        <th>场景</th><th>帧数</th><th>平均FPS</th><th>p50 ms</th><th>p95 ms</th><th>最大 ms</th>
        <th>卡顿帧</th><th>draw</th><th>三角面</th><th>着色器增量</th><th>vs 基线</th><th>draw 差值</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="log"></div>
</div>

<!-- 收起后的细条：面板藏起来时，测试仍然能看见画面，同时保留实时 FPS + 进度 -->
<div id="hudMini">
  <button id="btnHudShow">面板</button>
  <span id="miniProg">准备中…</span>
  <span id="miniFps">– FPS</span>
</div>

<div id="stage"></div>
<script type="module" src="./src/perf/PerfBench.js"></script>
</body>
</html>
