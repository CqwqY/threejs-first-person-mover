<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>花草中学 · Three.js</title>
  <style>
    /* 页面无滚动条，铺满全屏 */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* 整页禁止浏览器手势（缩放/下拉刷新/横向橡皮筋），不只加在控件上 */
      touch-action: none;
      overscroll-behavior: none;
      /* WebKit 文字自动放大：旋转时会重算字号导致控件尺寸跳变，必须关掉 */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    /* canvas 容器占满整个视口 */
    #app {
      width: 100%;
      height: 100%;
      display: block;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 全屏 canvas 容器 -->
  <div id="app"></div>
  <!-- 使用 ES Module 引入主入口 -->
  <script type="module" src="./src/main.js?v=20261004t"></script>
</body>
</html>
