<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第一人称移动 · Three.js</title>
  <style>
    /* 页面无滚动条，铺满全屏 */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    /* canvas 容器占满整个视口 */
    #app {
      width: 100%;
      height: 100%;
      display: block;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <!-- 全屏 canvas 容器 -->
  <div id="app"></div>
  <!-- 使用 ES Module 引入主入口 -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
